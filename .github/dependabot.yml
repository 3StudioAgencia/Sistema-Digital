# Dependabot — atualizações automáticas de dependências (W0-A-008).
#
# - github-actions: mantém as actions pinadas por SHA atualizadas (Dependabot lê
#   o comentário `# vX` ao lado do SHA e abre PR bumpando o pin com segurança).
# - pip (apps/api): dependências do backend (uv — pyproject.toml + uv.lock).
# - npm (apps/web): dependências do frontend (pnpm — package.json + pnpm-lock.yaml).
#
# Cadência semanal e limite baixo de PRs abertos: o objetivo é segurança de
# supply chain sem inundar a fila (projeto free tier).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
