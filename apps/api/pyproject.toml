[project]
name = "rastreio-api"
version = "0.1.0"
description = "Backend FastAPI do Sistema de Rastreio de Provas Digitais (3Studio)"
readme = "README.md"
# Piso 3.11 conforme DAT §1.3; alvo de execução é 3.12 (.python-version / ADR-003)
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # [email] traz o email-validator p/ EmailStr no cadastro de usuários (W1-C04).
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "boto3>=1.34",
    # Cliente HTTP do adapter da Admin API do Supabase Auth (W1-C04). Runtime —
    # já era dev-dependency (testes de integração ASGI).
    "httpx>=0.27",
    # [crypto] traz a `cryptography` p/ verificação ES256/RS256 via JWKS (W1-C03).
    "pyjwt[crypto]>=2.8",
    "python-json-logger>=3.0",
    # Etiqueta da prova (W2-C06/DP-7): QR vetorial (segno, pure-python) +
    # PDF no tamanho físico exato (fpdf2) — gerados sob demanda, stateless.
    "segno>=1.6",
    "fpdf2>=2.8",
    # Parser de multipart/form-data do FastAPI (upload da arte — W2-C06).
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "moto[s3]>=5.0",
]

# ---------------------------------------------------------------------------
# Lint / formatação — ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (segurança — segredos hardcoded, etc.)
    "ASYNC",# flake8-async
    "RUF",  # regras próprias do ruff
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa `Depends(...)`/`Security(...)` como default de argumento por design;
# não é o anti-pattern de default mutável que o B008 visa.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts são o mecanismo do pytest · S105/S106: credenciais fictícias de teste
"tests/**" = ["S101", "S105", "S106"]
# migrations geradas seguem o template do Alembic
"migrations/**" = ["I001"]

# ---------------------------------------------------------------------------
# Tipagem — mypy (strict em todo o código de produção)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
files = ["src", "migrations"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# SDKs sem stubs completos; a fronteira tipada é o nosso adapter
module = ["boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Testes — pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Toda a suíte roda offline; testes que exigem Postgres fazem skip explícito
# quando o banco não está acessível (e FALHAM no CI via REQUIRE_DB_TESTS=1).
addopts = "--strict-markers"
markers = [
    "db: exige PostgreSQL acessível (docker compose up -d db ou service container do CI)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Piso da camada de infraestrutura (CLAUDE.md §8 exige ≥80% em domínio/serviço;
# domínio ainda não existe nesta wave — o piso sobe junto com as próximas waves).
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    # corpo de método abstrato é só docstring — nunca executa
    "@abstractmethod",
    # guarda de entry point de CLI/tarefa: não roda sob pytest (módulo != __main__)
    'if __name__ == "__main__":',
]
