# Alembic — migrations das TABELAS DE DOMÍNIO (DAT §2).
# A URL do banco NÃO vive aqui: migrations/env.py lê MIGRATIONS_DATABASE_URL
# (conexão direta, porta 5432 — ADR-007) do ambiente/.env.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Logging do CLI do Alembic (texto simples é adequado para execução manual/CI)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
