# Alembic - migrations das TABELAS DE DOMINIO (DAT secao 2).
# A URL do banco NAO vive aqui: migrations/env.py le MIGRATIONS_DATABASE_URL
# (conexao direta, porta 5432 - ADR-007) do ambiente/.env.
# NOTA: este arquivo deve permanecer ASCII puro - o Alembic le o .ini com o
# encoding do locale do SO (cp1252 no Windows), e acentos quebrariam o parse.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Logging do CLI do Alembic (texto simples e adequado para execucao manual/CI)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
