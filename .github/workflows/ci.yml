# ============================================================================
# CI — Rastreio de Provas Digitais
# api: lint + tipos + migrations (upgrade E downgrade) + testes com Postgres real
# web: lint + format + build + vitest (E2E Playwright roda local/gated — precisa
#      de browsers + stack rodando; ver docs/auth.md)
#
# Deploy: documentado e parametrizável ao final do arquivo (ADR-009).
# ============================================================================
name: CI

on:
  push:
    # develop é a branch de integração padrão (ADR-016): todo push nela passa
    # pela CI, fechando o gap "verde no CI" da DoD (W0-A-002).
    branches: [main, develop]
  pull_request:

# Least privilege: o CI só faz checkout/lint/teste/build (W0-A-010).
permissions:
  contents: read

# Cancela runs supersedidos da mesma ref — relevante agora que develop entra
# nos gatilhos de push; economiza minutos do free tier (W0-A-024).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff · mypy · alembic · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rastreio_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI usa o Postgres do service container para runtime e migrations.
      # Em produção são DUAS URLs distintas (pooler 6543 vs direta 5432 — ADR-007).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rastreio_test
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rastreio_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rastreio_test
      # No CI, banco indisponível é FALHA (localmente os testes @db fazem skip)
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar uv (com cache do lockfile)
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Instalar dependências (pinadas pelo lockfile)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tipos (mypy strict)
        run: uv run mypy

      - name: Migrations — upgrade em ambiente limpo (critério §5.1)
        run: uv run alembic upgrade head

      - name: Migrations — downgrade e reaplicação (repetibilidade)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Testes + cobertura (falha abaixo do piso configurado)
        run: uv run pytest --cov

  web:
    name: Web (lint · build · vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Placeholders de build: o client Supabase é lazy e só valida em runtime
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar pnpm (versão do campo packageManager)
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          # defaults.run.working-directory não se aplica a steps `uses:` —
          # apontar o manifesto explicitamente (única fonte da versão do pnpm)
          package_json_file: apps/web/package.json

      - name: Instalar Node (com cache do pnpm)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatação (Prettier)
        # Paridade com o gate de formato do job api (ruff format --check):
        # drift de Prettier também barra o CI (W0-A-011).
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Testes de componente/unidade (vitest)
        # Herméticos: mockam Supabase/next-navigation, sem rede/env. O E2E
        # (Playwright) é local/gated (browsers + dev server) — não roda aqui.
        run: pnpm test

# ============================================================================
# DEPLOY (documentado e parametrizável — ADR-009; sem segredos no repositório)
#
# As plataformas-alvo são revisáveis (free tier): Vercel para o web; host de
# containers (Fly.io/Render) para a API. Quando confirmadas com o responsável,
# descomente e parametrize com SECRETS do repositório (Settings → Secrets):
#
#   deploy-web:
#     needs: [api, web]
#     if: github.ref == 'refs/heads/main'
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
#       # Vercel: vincule o projeto (vercel link) e cadastre os secrets
#       #   VERCEL_TOKEN · VERCEL_ORG_ID · VERCEL_PROJECT_ID
#       # As variáveis NEXT_PUBLIC_* são configuradas no painel da Vercel.
#       - run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
#
#   deploy-api:
#     needs: [api, web]
#     if: github.ref == 'refs/heads/main'
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
#       # A API é um container portável (apps/api/Dockerfile) — qualquer host serve.
#       # Exemplo Fly.io (secrets: FLY_API_TOKEN; app criada com `fly launch`):
#       #   - uses: superfly/flyctl-actions/setup-flyctl@<sha> # pinar por SHA
#       #     (NÃO @master/@branch — supply chain; W0-A-008) ao ativar o deploy
#       #   - run: flyctl deploy --remote-only -c apps/api/fly.toml
#       #     env: { FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }} }
#       # O passo de release do host DEVE rodar `alembic upgrade head` (e aplicar
#       # os .sql de migrations/rls/ a partir da Wave 1) antes de trocar o tráfego.
#       # Smoke test pós-deploy: GET /health e GET /health/ready (RNF-024).
# ============================================================================
